services:
  postgres:
    image: postgres:18.1-alpine
    container_name: webshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      POSTGRES_DB: directus
    ports:
      - "5432:5432"
    volumes:
      - ${PROJECT_NAME:-webshop}_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    build:
      context: ./directus
      dockerfile: Dockerfile
    container_name: webshop-directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-replace-with-random-key-in-production}
      SECRET: ${DIRECTUS_SECRET:-replace-with-random-secret-in-production}
      
      DB_CLIENT: "postgres"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}
      
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-true}
      
      CACHE_ENABLED: "false"
      LOG_LEVEL: "debug"
      
      RATE_LIMITER_ENABLED: "false"
      
      EXTENSIONS_AUTO_RELOAD: "true"
      
      PUBLIC_REGISTRATION: "true"
      
      # Stripe configuration (optional - set in production)
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
    volumes:
      - ./directus/uploads:/directus/uploads
      - ${PROJECT_NAME:-webshop}_directus_extensions:/directus/extensions
      - ./directus/bootstrap:/directus/bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webshop-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_DIRECTUS_URL: ${VITE_DIRECTUS_URL:-http://localhost:8055}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - directus
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # Dependency checker - optional, disable for Railway deployment
  # dependency-checker:
  #   image: node:20-alpine
  #   container_name: webshop-dependency-checker
  #   volumes:
  #     - ./frontend:/app/frontend
  #     - ./directus:/app/directus
  #     - ./check-updates.sh:/app/check-updates.sh
  #   entrypoint: /bin/sh
  #   command: -c "apk add --no-cache bash && chmod +x /app/check-updates.sh && /app/check-updates.sh"
  #   depends_on:
  #     - directus
  #     - frontend

volumes:
  webshop_postgres_data:
  webshop_directus_uploads:
  webshop_directus_extensions:
